contact.title=Contact & Emergency Helplines
contact.subtitle=India doesn't have a single unified toll-free number for all blood requests. The fastest path in an emergency is usually the nearest hospital, or one of these verified national services.
contact.emergency.title=National Emergency
contact.emergency.108=free ambulance / emergency response, available in most states.
contact.emergency.104=health helpline for medical advice and information (availability varies by state).
contact.emergency.call108=Call 108
contact.eraktkosh.title=eRaktKosh (Govt. of India)
contact.eraktkosh.desc=Centralized blood bank management system by the Ministry of Health & Family Welfare, search live blood stock and blood banks nationwide.
