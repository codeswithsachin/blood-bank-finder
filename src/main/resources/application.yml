spring:
  application:
    name: blood-bank-finder
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/blood_bank_finder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  donation-gap-days: ${DONATION_GAP_DAYS:90}
  admin-token: ${ADMIN_TOKEN:change-me-in-railway}
  # Seeds the admin LOGIN account (web dashboard at /login) on first startup.
  # Different from admin-token above, which protects the raw /api/admin/** REST endpoints.
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin123}
  # Opens the default browser automatically on startup (local dev convenience).
  # Safe to leave true in production — it silently no-ops on headless servers.
  auto-open-browser: ${AUTO_OPEN_BROWSER:true}
